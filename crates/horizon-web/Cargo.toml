[package]
name = "horizon-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon in the browser: the host hooks of the patched std (web/std.patch), the worker pool's entry points, and the page's entry"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# The game with sound (Web Audio), without what the browser has no use for yet: controllers over
# HID, Play with Friends' tunnel.
horizon-client = { path = "../horizon-client", default-features = false, features = ["audio"] }
horizon-client-render = { path = "../horizon-client-render" }
# Preparation's steps that need no Java, run in the browser on files from the player's own
# Minecraft folder (src/prepare.rs).
horizon-prepare = { path = "../horizon-prepare" }

[lints]
workspace = true
