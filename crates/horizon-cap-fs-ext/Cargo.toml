[package]
name = "horizon-cap-fs-ext"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "cap-fs-ext 3 natively; in the browser (wasm32) the part of its API Horizon uses, over std::fs"

[lib]
name = "cap_fs_ext"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-fs-ext-native = { package = "cap-fs-ext", version = "3" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cap-std = { package = "horizon-cap-std", path = "../horizon-cap-std" }

[lints]
workspace = true
