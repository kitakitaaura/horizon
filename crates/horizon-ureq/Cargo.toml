[package]
name = "horizon-ureq"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ureq 2 natively; in the browser (wasm32) the part of its API Horizon uses, over synchronous XMLHttpRequest"

[lib]
name = "ureq"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq-native = { package = "ureq", version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["XmlHttpRequest"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[lints]
workspace = true
